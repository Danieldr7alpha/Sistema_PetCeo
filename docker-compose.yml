services:
  postgres:
    image: postgres:16-alpine
    container_name: ceo-pet-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ceo_pet_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ceo_pet_ai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ceo_pet_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ceo_pet_ai_postgres:
